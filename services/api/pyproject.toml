[project]
name = "panelwise-api"
version = "0.1.0"
description = "Panelwise API: screenplay to grounded storyboard and comic"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
# Older uv can't read this uv.lock the same way; CI and the Dockerfile pin 0.11.32 exactly.
required-version = ">=0.11.32"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["app", "tests", "tools"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# In parallel, one database per worker (tests/conftest.py); a test that hangs fails after five
# minutes with its traceback, instead of the CI job being cancelled at 20 with no trace.
addopts = "-n auto --timeout=300"
markers = ["db: needs a Postgres (TEST_DATABASE_URL); the gate provides one"]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.16.9",
]
